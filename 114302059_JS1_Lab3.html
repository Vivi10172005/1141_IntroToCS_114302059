<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>StudentlD_JS1_Lab3</title>
</head>
<body>
  <!-- 將 StudentID_Number 換成你的學號 -->
  <h1>StudentID_Number Guessing Game</h1>

  <!-- 空的 div：遊戲結束後插入 correct.jpg 或 wrong.jpg -->
  <div id="resultArea"></div>

  <script>
    (function() {
      // 設定最小值、最大值和最大嘗試次數
      var min = 1;
      var max = 100;
      var chances = 7;

      // 生成 1~100 的隨機答案
      var answer = Math.floor(Math.random() * 100) + 1;

      // 取得要插入圖片的 div
      var resultArea = document.getElementById('resultArea');

      // 一進入網頁就開始遊戲
      while (chances > 0) {

        // 使用者輸入數字
        var input = window.prompt(
          '請輸入一個整數 (範圍: ' + min + ' 到 ' + max + ')\n' +
          '剩餘嘗試次數: ' + chances
        );

        // 使用者按取消
        if (input === null) {
          alert('遊戲已取消。');
          break;
        }

        // 去掉前後空白
        input = input.trim();

        // 空值或非數字 → 提醒並重新輸入，不扣次數
        if (input === "" || isNaN(input)) {
          alert('輸入錯誤：請輸入有效的數字。該次輸入不會扣除嘗試次數。');
          continue; // 跳回 while 開頭
        }

        // 轉成數字
        var guess = Number(input);

        // 超出有效範圍 → 提醒並重新輸入，不扣次數
        if (guess < min || guess > max) {
          alert('輸入錯誤：請輸入介於 ' + min + ' 到 ' + max + ' 的數字。該次輸入不會扣除嘗試次數。');
          continue;
        }

        // 有效猜測，扣一次
        chances--;

        // 如果猜中
        if (guess === answer) {
          alert('恭喜你！答案正確！');
          resultArea.innerHTML = '<img src="images/correct.jpg" alt="Correct" />';
          break; // 遊戲結束
        } else {
          // 猜錯還有剩餘機會
          if (chances > 0) {
            if (guess < answer) {
              alert('太小了！再試一次。');
              // 可選：更新最小範圍，提示使用者更精準
              // min = Math.max(min, guess + 1);
            } else {
              alert('太大了！再試一次。');
              // 可選：更新最大範圍，提示使用者更精準
              // max = Math.min(max, guess - 1);
            }
          } else {
            // 用完機會
            alert('機會已用完。正確答案是：' + answer);
            resultArea.innerHTML = '<img src="images/wrong.jpg" alt="Wrong" />';
            break; // 遊戲結束
          }
        }

      } // while 結束

    })(); // IIFE 結束
  </script>
</body>
</html>
